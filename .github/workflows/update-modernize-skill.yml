name: Update golang-refactoring modernization guidance
on:
  schedule:
    - cron: '0 10 2 * *'  # 2nd of every month at 10am UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-modernize:
    if: github.repository_owner == 'eric642'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You maintain the Go modernization guidance inside the `golang-refactoring` skill (`skills/golang-refactoring/SKILL.md` and `skills/golang-refactoring/references/`) in this repository.

            Your job is to check if the modernization section and reference files need updating:

            1. Check https://go.dev/dl/ for the latest Go version. If a new Go version has been released that is not yet covered in `skills/golang-refactoring/references/modernize-versions.md`, research its changelog and add a new section with modernization opportunities.
            2. Check https://github.com/golangci/golangci-lint/releases for new golangci-lint releases. If new modernize analyzers have been added, update the analyzer notes in `skills/golang-refactoring/references/modernize-versions.md` and `skills/golang-refactoring/references/modernize-tooling.md` (and `skills/golang-refactoring/SKILL.md` if top-level modernization summaries or defaults changed).
            3. Check if any modernization suggestions in `skills/golang-refactoring/` have become too old to be relevant (e.g., patterns from 3+ years ago that should be considered baseline by now). Suggest removing them or moving them to a "baseline" note.
            4. Check for any significant Go ecosystem news (new standard library packages, deprecated APIs, security advisories) that should be reflected in the modernization guidance.
            5. Update the README.md if needed.

            If there are changes to make, open a PR with a clear description of what was updated and why. If there are different categories of changes, open separate PRs.

            If everything is already up to date, do nothing.
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash,WebFetch,WebSearch,mcp__github__get_file_contents,mcp__github__search_code,mcp__github__list_releases,mcp__github__get_latest_release,mcp__github__list_tags,mcp__github__create_pull_request,mcp__github__create_branch,mcp__github__push_files"
