<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="golang-skills">
  <title>golang-skills — Go AI Agent Skills</title>
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115"/>
    </clipPath>
    <clipPath id="grid-clip">
      <circle cx="256" cy="256" r="210"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="64" y1="24" x2="448" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132238"/>
      <stop offset="52%" stop-color="#0E192C"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="aura-grad" cx="256" cy="252" r="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#007D9C" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark-halo" cx="256" cy="256" r="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.44"/>
      <stop offset="48%" stop-color="#00ADD8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00ADD8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bracket-grad" x1="256" y1="130" x2="256" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="48%" stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#007D9C"/>
    </linearGradient>
    <linearGradient id="node-top-grad" x1="256" y1="78" x2="256" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="55%" stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#007D9C"/>
    </linearGradient>
    <linearGradient id="node-bot-grad" x1="256" y1="386" x2="256" y2="434" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="55%" stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#007D9C"/>
    </linearGradient>
    <linearGradient id="spark-grad" x1="212" y1="180" x2="304" y2="334" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E0FBFF"/>
      <stop offset="78%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#00ADD8"/>
    </linearGradient>
    <linearGradient id="rim-grad" x1="128" y1="0" x2="384" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.44"/>
      <stop offset="50%" stop-color="#00ADD8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1E3A5F" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Rich Dark Slate Background -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bg-grad)"/>
    <circle cx="256" cy="256" r="225" fill="url(#aura-grad)"/>

    <!-- Subtle Architectural Grid & Telemetry Ring -->
    <g clip-path="url(#grid-clip)" stroke="#00ADD8" stroke-opacity="0.06" stroke-width="1.5">
      <path d="M64 46V466M128 46V466M192 46V466M256 46V466M320 46V466M384 46V466M448 46V466"/>
      <path d="M46 64H466M46 128H466M46 192H466M46 256H466M46 320H466M46 384H466M46 448H466"/>
    </g>
    <circle cx="256" cy="256" r="192" fill="none" stroke="#38BDF8" stroke-opacity="0.11" stroke-width="2"/>

    <!-- Modular Skill Graph Bridges & Polar Neural Links -->
    <g fill="none" stroke="#00ADD8" stroke-opacity="0.54" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M178 150L256 102L334 150"/>
      <path d="M178 362L256 410L334 362"/>
    </g>
    <g fill="none" stroke="#67E8F9" stroke-opacity="0.34" stroke-width="5.5" stroke-linecap="round">
      <path d="M256 128V150M256 362V384"/>
    </g>

    <!-- Go Cyan-Teal Geometric Code Brackets -->
    <g fill="none" stroke="url(#bracket-grad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
      <path d="M178 150L88 256L178 362"/>
      <path d="M334 150L424 256L334 362"/>
    </g>

    <!-- Modular Skill Nodes -->
    <circle cx="256" cy="102" r="24" fill="url(#node-top-grad)"/>
    <circle cx="256" cy="102" r="9.5" fill="#0B1220"/>
    <circle cx="256" cy="102" r="4.2" fill="#E0FBFF"/>

    <circle cx="256" cy="410" r="24" fill="url(#node-bot-grad)"/>
    <circle cx="256" cy="410" r="9.5" fill="#0B1220"/>
    <circle cx="256" cy="410" r="4.2" fill="#E0FBFF"/>

    <!-- Bracket Terminal Snap Nodes -->
    <g>
      <circle cx="178" cy="150" r="7.5" fill="#0B1220"/>
      <circle cx="178" cy="150" r="4" fill="#E0FBFF"/>
      <circle cx="334" cy="150" r="7.5" fill="#0B1220"/>
      <circle cx="334" cy="150" r="4" fill="#E0FBFF"/>
      <circle cx="178" cy="362" r="7.5" fill="#0B1220"/>
      <circle cx="178" cy="362" r="4" fill="#E0FBFF"/>
      <circle cx="334" cy="362" r="7.5" fill="#0B1220"/>
      <circle cx="334" cy="362" r="4" fill="#E0FBFF"/>
    </g>

    <!-- Central AI Neural Spark & Companion Sparks -->
    <circle cx="256" cy="256" r="106" fill="url(#spark-halo)"/>
    <path d="M256 168Q268.37 243.63 344 256Q268.37 268.37 256 344Q243.63 268.37 168 256Q243.63 243.63 256 168Z" fill="url(#spark-grad)"/>
    <path d="M301 179Q303.97 195.03 320 198Q303.97 200.97 301 217Q298.03 200.97 282 198Q298.03 195.03 301 179Z" fill="#67E8F9"/>
    <path d="M211 302Q212.98 312.02 223 314Q212.98 315.98 211 326Q209.02 315.98 199 314Q209.02 312.02 211 302Z" fill="#48D6F5" fill-opacity="0.9"/>

    <!-- Top-lit Bevel Rim -->
    <rect x="2" y="2" width="508" height="508" rx="113" ry="113" fill="none" stroke="url(#rim-grad)" stroke-width="3.5"/>
  </g>
</svg>
